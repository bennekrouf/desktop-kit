name: CI

# Fast feedback on every pull request and on main.
#
# The desktop apps' CI, less what only an app needs: no GUI packages to
# install, no release build to check, no .exe to inspect.
#
# The apps build against this repository's main (or its branch named like an
# app pull request's), with no tag or version in between. So every change here
# also builds all of them: a change that breaks an app is found before it
# reaches main, not after.
on:
  pull_request:
  push:
    branches: [main]

# A newer push on the same ref cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting: blocking ───────────────────────────────────────────────────
  # No compile, reports in ~20s. .githooks/pre-commit formats what is staged,
  # so this is a real gate rather than a check that is red forever.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the version and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # ── Tests + clippy: blocking, on Linux, macOS and Windows ───────────────────
  # Every app builds this for each of these.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the version and components rust-toolchain.toml pins.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # --locked fails the run if Cargo.lock has drifted from Cargo.toml.
      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # ── Every app: blocking ────────────────────────────────────────────────────
  # Each app as it is on its branch named like this one when it has one (a
  # change made in both), otherwise on its default branch, built against this
  # kit. macOS: every app builds there, and needs no packages installed.
  apps:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: gitagent, name: GitAgent }
          - { repo: jobscout, name: JobScout }
          - { repo: polishcast, name: PolishCast }
          - { repo: publishkit, name: PublishKit }
          - { repo: shipscreen, name: ShipScreen }
          - { repo: spreadradar, name: SpreadRadar }
          - { repo: surface-watch, name: SurfaceWatch }
          - { repo: trackcut, name: TrackCut }
    runs-on: macos-latest
    steps:
      - name: Which branch of ${{ matrix.name }}
        id: app
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          url=https://github.com/bennekrouf/${{ matrix.repo }}.git
          ref=""
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
            ref=$BRANCH
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.name }} ${ref:-default branch}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Side by side, as the apps build: Cargo.toml has path = "../desktop-kit".
      - uses: actions/checkout@v4
        with:
          path: desktop-kit
      - uses: actions/checkout@v4
        with:
          repository: bennekrouf/${{ matrix.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: app

      - name: Install the app's toolchain
        working-directory: app
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.repo }}

      # The kit's own entries in the app's Cargo.lock, as the app's CI takes
      # them; then everything the app compiles, tests included.
      - name: Build ${{ matrix.name }}
        working-directory: app
        run: |
          cargo update --quiet -p desktop-kit
          cargo check --workspace --all-targets --locked
